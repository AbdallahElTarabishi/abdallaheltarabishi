<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10192e"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <!-- Background circle with border -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- Laptop icon outline / Tech monogram -->
  <rect x="18" y="20" width="28" height="18" rx="2" fill="none" stroke="url(#grad)" stroke-width="2.2"/>
  <line x1="14" y1="42" x2="50" y2="42" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Monogram T / Lightning -->
  <path d="M26 26 h12 M32 26 v9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="1.5" fill="#00f2fe"/>
</svg>

